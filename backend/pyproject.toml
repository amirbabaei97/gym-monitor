[project]
name = "gym-monitor"
version = "2.0.0"
description = "Gym Wall of Shame: syncs Fitness First check-ins and serves the dashboard"
requires-python = ">=3.14"
license = "GPL-2.0-only"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "httpx[brotli]>=0.28",
    "pydantic-settings>=2.16",
]

[project.scripts]
gym = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
